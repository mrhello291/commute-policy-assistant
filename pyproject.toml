[project]
name = "commute-policy-assistant"
version = "0.1.0"
description = "Answers employee transport questions from their own company's current policy, with citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "pyyaml>=6",
    "chromadb==1.5.9",
    "rank-bm25>=0.2.2",
    "groq>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Third-party deprecation noise on newer Pythons, not ours to fix.
    "ignore::DeprecationWarning:chromadb.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI's Depends() in argument defaults is the framework's intended style.
ignore = ["B008"]
