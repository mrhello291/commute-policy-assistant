[project]
name = "commute-policy-assistant"
version = "0.1.0"
description = "Answers employee transport questions from their own company's current policy, with citations."
readme = "README.md"
requires-python = ">=3.12"
# Pinned so a fresh clone builds what was tested; constraints.txt pins the rest.
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.3",
    "pyjwt==2.15.1",
    "pyyaml==6.0.3",
    "pdfplumber==0.11.10",
    "python-multipart==0.0.34",
    "chromadb==1.5.9",
    "rank-bm25==0.2.2",
    "groq==1.7.0",
    "google-genai==3.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    # Draws the sample policy PDFs and the PDFs the parser tests read.
    "reportlab==5.1.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Third-party deprecation noise on newer Pythons, not ours to fix.
    "ignore::DeprecationWarning:chromadb.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI's Depends() in argument defaults is the framework's intended style.
ignore = ["B008"]
