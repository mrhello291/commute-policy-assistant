services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - policy_data:/data
      # So `docker compose run --rm app python -m evaluation.run` leaves its
      # results on the host.
      - ./evaluation/results:/srv/evaluation/results

volumes:
  policy_data:
